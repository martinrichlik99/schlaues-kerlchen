<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Schlaues Kerlchen</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schlaues Kerlchen">
<meta name="theme-color" content="#0c0716">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
  html, body { height: 100%; }
  html {
    background: #0c0716;
  }
  html::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(circle at 20% 0%, #2a1a4a 0%, #150c28 45%, #0c0716 100%);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f2eefc;
    min-height: 100%;
    display: flex;
    justify-content: center;
  }
  #app { width: 100%; max-width: 480px; min-height: 100vh; display: flex; flex-direction: column; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); }

  .kopf { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .kopf-links { display: flex; align-items: center; gap: 10px; }
  .kopf-zurueck {
    display: none; align-items: center; justify-content: center;
    width: 34px; height: 34px; border-radius: 10px;
    background: rgba(255,255,255,0.06); color: #cbb8f0; font-size: 17px;
    cursor: pointer; flex-shrink: 0; border: none;
  }
  .logo { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .logo span { background: linear-gradient(90deg, #ff8a5c, #ff5c9e); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .streak { font-size: 13px; color: #cbb8f0; background: rgba(255,255,255,0.06); padding: 6px 10px; border-radius: 20px; }

  .karte { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 22px; }

  /* Start */
  #start-blatt .titel { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
  #start-blatt .untertitel { font-size: 14px; color: #b7aad6; margin-bottom: 20px; }
  .stat-reihe { display: flex; gap: 10px; margin-bottom: 20px; }
  .stat { flex: 1; background: rgba(255,255,255,0.05); border-radius: 14px; padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: #b7aad6; }
  #stat-knopf { width: 100%; border: none; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }

  /* Auswertung */
  #auswertung-blatt { display: none; }
  .aw-titel { font-size: 22px; font-weight: 800; margin-bottom: 16px; }
  .abschnitt { font-size: 12px; font-weight: 700; color: #b7aad6; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .abschnitt small { font-weight: 400; text-transform: none; letter-spacing: 0; }
  .aw-tabelle { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .aw-tabelle th { font-size: 11px; font-weight: 600; color: #b7aad6; text-align: right; padding: 0 4px 8px; }
  .aw-tabelle td { text-align: right; padding: 9px 4px; border-top: 1px solid rgba(255,255,255,0.08); }
  .aw-tabelle th:first-child, .aw-tabelle td:first-child { text-align: left; }
  .aw-tabelle .richtig { color: #7be8bd; }
  .aw-tabelle .falsch { color: #ff8ba0; }
  .aw-tabelle + .abschnitt, .abzeichen-liste + .abschnitt { margin-top: 22px; }
  .abzeichen-liste { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .abzeichen {
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
    background: rgba(255,255,255,0.05); border-radius: 14px; padding: 10px 6px; font-size: 11px; line-height: 1.25;
  }
  .abzeichen b { font-size: 22px; font-weight: 400; }
  .abzeichen.offen { opacity: 0.35; filter: grayscale(1); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .sprachtest { display: flex; gap: 8px; margin-top: 10px; }
  #sprachtest-ausgabe { font-size: 13px; color: #ddd4f5; margin-top: 10px; min-height: 18px; }
  .kategorie-kachel {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, rgba(255,138,92,0.18), rgba(255,92,158,0.12));
    border: 1px solid rgba(255,138,92,0.35); border-radius: 16px; padding: 14px;
    cursor: pointer; width: 100%; font: inherit; color: inherit; text-align: left;
  }
  .kategorie-kachel .name, .kategorie-kachel .anzahl { display: block; }
  .kategorie-kachel .name { font-size: 14.5px; font-weight: 700; line-height: 1.25; }
  .kategorie-kachel .anzahl { font-size: 10.5px; color: #d8c9ff; margin-top: 2px; }
  .kategorie-kachel .pfeil { font-size: 18px; color: #ff8a5c; flex-shrink: 0; margin-left: 6px; }
  .schnell-reihe { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
  .schnell-kachel {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    min-height: 104px; padding: 12px 6px; border-radius: 16px; cursor: pointer;
    width: 100%; font: inherit; color: inherit; text-align: center;
  }
  .schnell-kachel .icon { font-size: 22px; line-height: 1; }
  .schnell-kachel .name { font-size: 13px; font-weight: 700; line-height: 1.2; }
  .schnell-kachel .anzahl { font-size: 11px; color: #d8c9ff; }
  .auto-schalter {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12);
    transition: background 0.2s, border-color 0.2s;
  }
  .auto-schalter:has(input:checked) { background: rgba(90,220,170,0.2); border-color: rgba(90,220,170,0.6); }
  .auto-schalter input {
    appearance: none; -webkit-appearance: none; flex-shrink: 0; cursor: pointer;
    width: 52px; height: 32px; border-radius: 16px; background: rgba(255,255,255,0.15);
    position: relative; transition: background 0.2s;
  }
  .auto-schalter input::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px;
    border-radius: 50%; background: #f2eefc; transition: transform 0.2s;
  }
  .auto-schalter input:checked { background: #5adcaa; }
  .auto-schalter input:checked::after { transform: translateX(20px); }
  .kachel-gemischt {
    background: linear-gradient(135deg, rgba(139,92,246,0.22), rgba(34,211,238,0.14));
    border: 1px solid rgba(139,92,246,0.4);
  }
  .kachel-faellig {
    background: linear-gradient(135deg, rgba(56,189,248,0.2), rgba(90,220,170,0.12));
    border: 1px solid rgba(56,189,248,0.45);
  }
  .kachel-nicht-gewusst {
    background: linear-gradient(135deg, rgba(255,92,120,0.2), rgba(255,157,115,0.12));
    border: 1px solid rgba(255,92,120,0.4);
  }
  .trennlinie { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 4px 0 12px; }
  #kategorien-liste { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bald { margin-top: 12px; font-size: 12px; color: #8677a8; text-align: center; }

  /* Quiz */
  #quiz-blatt { display: none; flex: 1; flex-direction: column; padding-bottom: 76px; }
  .fortschritt-leiste { height: 6px; background: rgba(255,255,255,0.08); border-radius: 6px; overflow: hidden; margin-bottom: 18px; }
  .fortschritt-leiste i { display: block; height: 100%; background: linear-gradient(90deg, #ff8a5c, #ff5c9e); }
  .quiz-kopf { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  .frage-zaehler { font-size: 12px; color: #b7aad6; }
  .leiter { font-size: 12px; font-weight: 700; color: #ffd27a; background: rgba(255,210,122,0.1); padding: 4px 9px; border-radius: 12px; white-space: nowrap; }
  .frage-text { font-size: 20px; font-weight: 700; line-height: 1.4; margin-bottom: 18px; }
  .frage-sterne { font-size: 16px; letter-spacing: 2px; margin-bottom: 6px; min-height: 20px; }
  .frage-daumen { font-size: 16px; letter-spacing: 2px; margin-bottom: 6px; min-height: 20px; }
  .antwort-kurz { font-size: 18px; font-weight: 800; color: #ff9d73; margin-bottom: 10px; }
  .erklaerung-text { font-size: 15px; line-height: 1.55; color: #ddd4f5; }
  .vorlesen-btn {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 15;
    width: calc(100% - 36px); max-width: 444px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(90deg, #ff8a5c, #ff5c9e);
    border: none; color: #1c0f2e; font-size: 14px; font-weight: 700;
    padding: 16px 26px; border-radius: 16px; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  .knopf-reihe { display: flex; gap: 10px; margin-top: 20px; }
  .knopf { flex: 1; border: none; border-radius: 16px; padding: 16px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .knopf-primaer { background: linear-gradient(90deg, #ff8a5c, #ff5c9e); color: #1c0f2e; }
  .knopf-schwach { background: rgba(255,255,255,0.05); font-size: 13px; color: #cbb8f0; }
  .knopf-nein { background: rgba(255,92,120,0.16); color: #ff8ba0; }
  .knopf-ja { background: rgba(90,220,170,0.18); color: #7be8bd; }

  /* Ende */
  #ende-blatt { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #ende-blatt .zahl { font-size: 44px; font-weight: 800; }
  #ende-blatt .zeile { font-size: 14px; color: #b7aad6; margin-top: 6px; margin-bottom: 24px; }

  .fehler-toast {
    position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 448px; margin: 0 auto;
    background: #4a1420; border: 1px solid #ff5c78; color: #ffd7de; padding: 12px 16px;
    border-radius: 12px; font-size: 13px; display: none; z-index: 20;
  }
  .fehler-toast.gut { background: #0f3a2c; border-color: #5adcaa; color: #d6fbe9; }
</style>
</head>
<body>
<div id="app">
  <div class="kopf">
    <div class="kopf-links">
      <button type="button" class="kopf-zurueck" id="kopf-zurueck-icon" aria-label="Zurück zur Startseite">←</button>
      <div class="logo">Schlaues <span>Kerlchen</span></div>
    </div>
    <div class="streak" id="streak-anzeige">🔥 0 Tage</div>
  </div>

  <div id="start-blatt">
    <div class="titel">Wie schlau bist du heute?</div>
    <div class="untertitel">Allgemeinwissen, ausführlich erklärt — mit Vorlesefunktion.</div>

    <button type="button" class="stat-reihe" id="stat-knopf" aria-label="Auswertung öffnen">
      <span class="stat"><b id="stat-gewusst">0</b><span>Gewusst</span></span>
      <span class="stat"><b id="stat-beantwortet">0</b><span>Beantwortet</span></span>
      <span class="stat"><b id="stat-quote">0%</b><span>Trefferquote</span></span>
    </button>

    <div class="schnell-reihe">
      <label class="schnell-kachel auto-schalter">
        <span class="icon" aria-hidden="true">🚗</span>
        <span class="name">Auto</span>
        <input type="checkbox" role="switch" id="auto-modus" aria-label="Auto-Modus: liest Frage und Antwort automatisch vor">
      </label>
      <button type="button" class="schnell-kachel kachel-faellig" id="kachel-faellig">
        <span class="icon" aria-hidden="true">📅</span>
        <span class="name">Fällig</span>
        <span class="anzahl" id="anzahl-faellig">0 Fragen</span>
      </button>
      <button type="button" class="schnell-kachel kachel-gemischt" id="kachel-alle">
        <span class="icon" aria-hidden="true">🎲</span>
        <span class="name">Gemischt</span>
        <span class="anzahl" id="anzahl-alle">wird geladen …</span>
      </button>
      <button type="button" class="schnell-kachel kachel-nicht-gewusst" id="kachel-nichtGewusst">
        <span class="icon" aria-hidden="true">🔁</span>
        <span class="name">Nicht gewusst</span>
        <span class="anzahl" id="anzahl-nichtGewusst">0 Fragen</span>
      </button>
    </div>
    <hr class="trennlinie">
    <div id="kategorien-liste"></div>
  </div>

  <div id="quiz-blatt">
    <div class="fortschritt-leiste"><i id="fortschritt-fuellung" style="width:0%"></i></div>
    <div class="quiz-kopf">
      <div class="frage-zaehler" id="frage-zaehler">Frage 1 von 50</div>
      <div class="leiter" id="leiter-anzeige"></div>
    </div>
    <div class="karte">
      <div class="frage-sterne" id="frage-sterne"></div>
      <div class="frage-daumen" id="frage-daumen"></div>
      <div class="frage-text" id="frage-text"></div>
      <div id="antwort-bereich" style="display:none">
        <div class="antwort-kurz" id="antwort-kurz-text"></div>
        <div class="erklaerung-text" id="erklaerung-text"></div>
      </div>
      <button class="vorlesen-btn" id="vorlesen-btn" type="button">🔊 Vorlesen</button>
    </div>

    <div id="frage-knoepfe" class="knopf-reihe">
      <button class="knopf knopf-primaer" id="antwort-zeigen-btn" type="button">Antwort zeigen</button>
    </div>
    <div id="bewertung-knoepfe" class="knopf-reihe" style="display:none">
      <button class="knopf knopf-nein" id="nicht-gewusst-btn" type="button">✗ Nicht gewusst</button>
      <button class="knopf knopf-ja" id="gewusst-btn" type="button">✓ Gewusst</button>
    </div>
  </div>

  <div id="auswertung-blatt">
    <div class="aw-titel">📊 Auswertung</div>
    <div class="abschnitt">Antworten</div>
    <div class="stat-reihe" id="aw-antworten"></div>
    <div class="abschnitt">Millionen-Leiter</div>
    <div class="stat-reihe" id="aw-leiter"></div>
    <div class="abschnitt">Fragen</div>
    <div class="stat-reihe" id="aw-fragen"></div>
    <div class="abschnitt">Je Kategorie <small>· schwächste zuerst</small></div>
    <table class="aw-tabelle">
      <thead><tr><th scope="col">Kategorie</th><th scope="col">Beantw.</th><th scope="col">Richtig</th><th scope="col">Falsch</th><th scope="col">Quote</th></tr></thead>
      <tbody id="aw-kategorien"></tbody>
    </table>
    <div class="abschnitt">Abzeichen</div>
    <div class="abzeichen-liste" id="aw-abzeichen"></div>
    <div class="abschnitt">Test Sprachsteuerung</div>
    <div class="sprachtest">
      <button type="button" class="knopf knopf-schwach" id="sprachtest-ansage-btn">🔊 Mit Ansage</button>
      <button type="button" class="knopf knopf-schwach" id="sprachtest-direkt-btn">🎤 Direkt</button>
    </div>
    <div id="sprachtest-ausgabe" aria-live="polite"></div>
  </div>

  <div id="ende-blatt">
    <div class="zahl" id="ende-zahl">0 / 0</div>
    <div class="zeile">Fragen gewusst</div>
    <div class="knopf-reihe" style="width:100%">
      <button class="knopf knopf-schwach" id="ende-zurueck-btn" type="button">Zur Startseite</button>
      <button class="knopf knopf-primaer" id="ende-nochmal-btn" type="button">Nochmal</button>
    </div>
  </div>
</div>
<div class="fehler-toast" id="fehler-toast"></div>

<script>
(function () {
  "use strict";

  var SPEICHER_SCHLUESSEL = "sk_fortschritt_v1";
  var KATEGORIEN = [
    { id: "geschichte", name: "Geschichte", icon: "📜", datei: "daten/geschichte.json" },
    { id: "geographie", name: "Geographie", icon: "🌍", datei: "daten/geographie.json" },
    { id: "wissenschaft", name: "Wissenschaft", icon: "🔬", datei: "daten/wissenschaft.json" },
    { id: "politik", name: "Politik", icon: "🏛️", datei: "daten/politik.json" },
    { id: "natur", name: "Natur", icon: "🌿", datei: "daten/natur.json" },
    { id: "wirtschaft", name: "Wirtschaft", icon: "💶", datei: "daten/wirtschaft.json" },
    { id: "kunst", name: "Kunst", icon: "🎨", datei: "daten/kunst.json" },
    { id: "musik", name: "Musik", icon: "🎵", datei: "daten/musik.json" },
    { id: "mythologie", name: "Mythologie", icon: "⚡", datei: "daten/mythologie.json" },
    { id: "literatur", name: "Literatur", icon: "📚", datei: "daten/literatur.json" },
    { id: "philosophie", name: "Philosophie", icon: "🦉", datei: "daten/philosophie.json" },
    { id: "technologie", name: "Technologie", icon: "💻", datei: "daten/technologie.json" },
    { id: "oesterreich", name: "Österreich", icon: "🇦🇹", datei: "daten/oesterreich.json" },
    { id: "laender", name: "Länder & Hauptstädte", icon: "🗺️", datei: "daten/laender-hauptstaedte.json" }
  ];
  // Länder & Hauptstädte bewusst NICHT Teil der wöchentlichen Automations-Routine (Martins Wunsch 2026-09-18) —
  // Kategorie ist eine feste Faktenliste (alle 193 UN-Mitgliedstaaten + Vatikanstadt), keine Trivia-Fragen.
  var fragenNachKategorie = {};
  var aktiveKategorieId = null;
  var quizFragen = [];
  var quizIndex = 0;
  var quizGewusst = 0;
  var antwortSichtbar = false;
  var vorleseWarteschlange = [];
  var vorleseLauf = 0;
  var autoModus = false;
  var TAGESZIEL = 30;
  var LEITER = [0, 50, 100, 200, 300, 500, 1000, 2000, 4000, 8000, 16000, 32000, 64000, 125000, 500000, 1000000];
  var WIEDERHOLUNG_TAGE = [0, 1, 3, 7, 14];
  var sprachtestAnsage = null;

  function esc(wert) {
    if (wert === null || wert === undefined) { return ""; }
    return String(wert)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function localISODate(d) {
    var jahr = d.getFullYear();
    var monat = String(d.getMonth() + 1).padStart(2, "0");
    var tag = String(d.getDate()).padStart(2, "0");
    return jahr + "-" + monat + "-" + tag;
  }

  var toastTimer = null;
  function zeigeFehler(text, gut) {
    var toast = document.getElementById("fehler-toast");
    toast.textContent = text;
    toast.classList.toggle("gut", !!gut);
    toast.style.display = "block";
    window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () { toast.style.display = "none"; }, 4000);
  }

  function tagPlus(tage) {
    var d = new Date();
    d.setDate(d.getDate() + tage);
    return localISODate(d);
  }

  function euro(betrag) {
    return betrag === 1000000 ? "1 Mio. €" : betrag.toLocaleString("de-DE") + " €";
  }

  function leererFortschritt() {
    return { kategorien: {}, streak: { anzahl: 0, letzterTag: "" }, fragenStatus: {},
      leiter: { stufe: 0, best: 0, millionen: 0 }, heute: { tag: "", anzahl: 0 }, abzeichen: {} };
  }

  function ladeFortschritt() {
    var roh;
    try {
      roh = localStorage.getItem(SPEICHER_SCHLUESSEL);
    } catch (e) {
      zeigeFehler("Speicher nicht lesbar — Fortschritt wird diese Sitzung nicht gemerkt.");
      return leererFortschritt();
    }
    if (!roh) { return leererFortschritt(); }
    var daten;
    try {
      daten = JSON.parse(roh);
    } catch (e) {
      zeigeFehler("Gespeicherter Fortschritt war beschädigt — neu gestartet.");
      return leererFortschritt();
    }
    if (!daten || typeof daten !== "object") { return leererFortschritt(); }
    if (!daten.kategorien || typeof daten.kategorien !== "object") { daten.kategorien = {}; }
    if (!daten.streak || typeof daten.streak !== "object") { daten.streak = { anzahl: 0, letzterTag: "" }; }
    if (typeof daten.streak.anzahl !== "number") { daten.streak.anzahl = 0; }
    if (typeof daten.streak.letzterTag !== "string") { daten.streak.letzterTag = ""; }
    if (!daten.fragenStatus || typeof daten.fragenStatus !== "object") { daten.fragenStatus = {}; }
    var leer = leererFortschritt();
    ["leiter", "heute", "abzeichen"].forEach(function (feld) {
      if (!daten[feld] || typeof daten[feld] !== "object") { daten[feld] = leer[feld]; }
    });
    return daten;
  }

  function speichereSicher(daten) {
    try {
      localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(daten));
    } catch (e) {
      zeigeFehler("Fortschritt konnte nicht gespeichert werden (Speicher voll?).");
    }
  }

  var fortschritt = ladeFortschritt();

  function kategorieZaehler(name) {
    if (!fortschritt.kategorien[name] || typeof fortschritt.kategorien[name] !== "object") {
      fortschritt.kategorien[name] = { gewusst: 0, nichtGewusst: 0 };
    }
    if (typeof fortschritt.kategorien[name].gewusst !== "number") { fortschritt.kategorien[name].gewusst = 0; }
    if (typeof fortschritt.kategorien[name].nichtGewusst !== "number") { fortschritt.kategorien[name].nichtGewusst = 0; }
    return fortschritt.kategorien[name];
  }

  function gesamtZaehler() {
    var gewusst = 0;
    var beantwortet = 0;
    var namen = Object.keys(fortschritt.kategorien);
    for (var i = 0; i < namen.length; i++) {
      var k = fortschritt.kategorien[namen[i]];
      gewusst += k.gewusst || 0;
      beantwortet += (k.gewusst || 0) + (k.nichtGewusst || 0);
    }
    return { gewusst: gewusst, beantwortet: beantwortet };
  }

  var GEMEISTERT_AB = 5;

  function holeFragenStatus(id) {
    var s = fortschritt.fragenStatus[id];
    if (!s || typeof s !== "object") { return { gewusstCount: 0, nichtGewusstCount: 0, ort: "kategorie" }; }
    return {
      gewusstCount: typeof s.gewusstCount === "number" ? s.gewusstCount : 0,
      nichtGewusstCount: typeof s.nichtGewusstCount === "number" ? s.nichtGewusstCount : 0,
      ort: s.ort === "nichtGewusst" ? "nichtGewusst" : "kategorie"
    };
  }

  function setzeFragenStatus(id, status) {
    fortschritt.fragenStatus[id] = status;
  }

  function istInNichtGewusst(frage) {
    var s = holeFragenStatus(frage.id);
    return s.gewusstCount < GEMEISTERT_AB && s.ort === "nichtGewusst";
  }

  function istAktivInKategorie(frage) {
    var s = holeFragenStatus(frage.id);
    return s.gewusstCount < GEMEISTERT_AB && s.ort !== "nichtGewusst";
  }

  function aktivePoolFuerKategorie(kategorieId) {
    var alle = fragenNachKategorie[kategorieId] || [];
    var aktiv = [];
    for (var i = 0; i < alle.length; i++) {
      if (istAktivInKategorie(alle[i])) { aktiv.push(alle[i]); }
    }
    return aktiv;
  }

  function nichtGewusstPool() {
    var alle = alleFragenGemischt();
    var pool = [];
    for (var i = 0; i < alle.length; i++) {
      if (istInNichtGewusst(alle[i])) { pool.push(alle[i]); }
    }
    return pool;
  }

  // Fehlt faelligAb (Sterne aus der Zeit vor der Wiederholungs-Logik), gilt die Frage als fällig.
  function istFaellig(frage) {
    var s = fortschritt.fragenStatus[frage.id];
    return holeFragenStatus(frage.id).gewusstCount > 0 && istAktivInKategorie(frage) && !(s && s.faelligAb > tagPlus(0));
  }

  function faelligPool() {
    return alleFragenGemischt().filter(istFaellig);
  }

  function gemischtPool() {
    var alle = alleFragenGemischt();
    var pool = [];
    for (var i = 0; i < alle.length; i++) {
      if (istAktivInKategorie(alle[i])) { pool.push(alle[i]); }
    }
    return pool;
  }

  function aktualisiereStartAnzeige() {
    var g = gesamtZaehler();
    document.getElementById("stat-gewusst").textContent = String(g.gewusst);
    document.getElementById("stat-beantwortet").textContent = String(g.beantwortet);
    var quote = g.beantwortet > 0 ? Math.round((g.gewusst / g.beantwortet) * 100) : 0;
    document.getElementById("stat-quote").textContent = quote + "%";
    var s = fortschritt.streak;
    var streakLaeuft = s.letzterTag === tagPlus(0) || s.letzterTag === tagPlus(-1);
    var heute = fortschritt.heute.tag === tagPlus(0) ? fortschritt.heute.anzahl : 0;
    document.getElementById("streak-anzeige").textContent = "🔥 " + (streakLaeuft ? s.anzahl : 0) + " · " +
      (heute >= TAGESZIEL ? "✅ " : "🎯 ") + heute + "/" + TAGESZIEL;
  }

  function setzeKategorieAnzahl(kategorieId, text) {
    var el = document.getElementById("anzahl-" + kategorieId);
    if (el) { el.textContent = text; }
  }

  function aktualisiereKachelAnzahlen() {
    for (var i = 0; i < KATEGORIEN.length; i++) {
      var kat = KATEGORIEN[i];
      if (fragenNachKategorie[kat.id]) {
        setzeKategorieAnzahl(kat.id, aktivePoolFuerKategorie(kat.id).length + " Fragen");
      }
    }
    var alleEl = document.getElementById("anzahl-alle");
    if (alleEl) { alleEl.textContent = gemischtPool().length + " Fragen"; }
    var ngEl = document.getElementById("anzahl-nichtGewusst");
    if (ngEl) { ngEl.textContent = nichtGewusstPool().length + " Fragen"; }
    document.getElementById("anzahl-faellig").textContent = faelligPool().length + " Fragen";
  }

  function renderKategorienListe() {
    var container = document.getElementById("kategorien-liste");
    var html = "";
    for (var i = 0; i < KATEGORIEN.length; i++) {
      var kat = KATEGORIEN[i];
      html += '<button type="button" class="kategorie-kachel" id="kachel-' + kat.id + '">' +
        '<span><span class="name">' + kat.icon + ' ' + esc(kat.name) + '</span>' +
        '<span class="anzahl" id="anzahl-' + kat.id + '">wird geladen …</span></span>' +
        '<span class="pfeil" aria-hidden="true">→</span></button>';
    }
    container.innerHTML = html;
    for (var j = 0; j < KATEGORIEN.length; j++) {
      (function (kategorieId) {
        document.getElementById("kachel-" + kategorieId).addEventListener("click", function () { starteQuiz(kategorieId); });
      })(KATEGORIEN[j].id);
    }
  }

  function vermerkeStreakHeute() {
    var heute = localISODate(new Date());
    if (fortschritt.streak.letzterTag === heute) { return; }
    var gestern = new Date();
    gestern.setDate(gestern.getDate() - 1);
    if (fortschritt.streak.letzterTag === localISODate(gestern)) {
      fortschritt.streak.anzahl = (fortschritt.streak.anzahl || 0) + 1;
    } else {
      fortschritt.streak.anzahl = 1;
    }
    fortschritt.streak.letzterTag = heute;
    speichereSicher(fortschritt);
  }

  var ABZEICHEN = [
    { id: "antw10", icon: "🌱", name: "10 Antworten", erreicht: function (k) { return k.beantwortet >= 10; } },
    { id: "antw100", icon: "📘", name: "100 Antworten", erreicht: function (k) { return k.beantwortet >= 100; } },
    { id: "antw1000", icon: "🏛️", name: "1000 Antworten", erreicht: function (k) { return k.beantwortet >= 1000; } },
    { id: "gem10", icon: "⭐", name: "10 gemeistert", erreicht: function (k) { return k.gemeistert >= 10; } },
    { id: "gem100", icon: "🌟", name: "100 gemeistert", erreicht: function (k) { return k.gemeistert >= 100; } },
    { id: "streak7", icon: "🔥", name: "7 Tage in Folge", erreicht: function (k) { return k.streak >= 7; } },
    { id: "streak30", icon: "☄️", name: "30 Tage in Folge", erreicht: function (k) { return k.streak >= 30; } },
    { id: "million", icon: "💰", name: "Million geknackt", erreicht: function (k) { return k.millionen >= 1; } }
  ].concat(KATEGORIEN.map(function (kat) {
    return { id: "kat_" + kat.id, icon: kat.icon, name: kat.name + " gemeistert", erreicht: function (k) { return k.komplett[kat.id]; } };
  }));

  function abzeichenKennzahlen() {
    var komplett = {};
    var gemeistert = 0;
    KATEGORIEN.forEach(function (kat) {
      var liste = fragenNachKategorie[kat.id] || [];
      var fertig = liste.filter(function (f) { return holeFragenStatus(f.id).gewusstCount >= GEMEISTERT_AB; }).length;
      gemeistert += fertig;
      komplett[kat.id] = liste.length > 0 && fertig === liste.length;
    });
    return { beantwortet: gesamtZaehler().beantwortet, gemeistert: gemeistert, streak: fortschritt.streak.anzahl || 0,
      millionen: fortschritt.leiter.millionen || 0, komplett: komplett };
  }

  function pruefeAbzeichen() {
    var k = abzeichenKennzahlen();
    var neu = [];
    ABZEICHEN.forEach(function (a) {
      if (!fortschritt.abzeichen[a.id] && a.erreicht(k)) {
        fortschritt.abzeichen[a.id] = tagPlus(0);
        neu.push(a.icon + " " + a.name);
      }
    });
    return neu;
  }

  function mische(liste) {
    var ergebnis = liste.slice();
    for (var i = ergebnis.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tausch = ergebnis[i];
      ergebnis[i] = ergebnis[j];
      ergebnis[j] = tausch;
    }
    return ergebnis;
  }

  function vorleseHaeppchen(text) {
    var woerter = text.split(/\s+/).filter(function (w) { return w.length > 0; });
    var haeppchen = [];
    var aktuell = [];
    for (var i = 0; i < woerter.length; i++) {
      aktuell.push(woerter[i]);
      if (aktuell.length >= 12) { haeppchen.push(aktuell.join(" ")); aktuell = []; }
    }
    if (aktuell.length > 0) { haeppchen.push(aktuell.join(" ")); }
    return haeppchen.length > 0 ? haeppchen : [text];
  }

  // cancel() löst bei Safari onend des laufenden Häppchens aus — ohne Laufnummer würde die alte Kette weiterlesen.
  function stoppeVorlesen() {
    vorleseLauf += 1;
    vorleseWarteschlange = [];
    if ("speechSynthesis" in window) { window.speechSynthesis.cancel(); }
  }

  function vorlesen(text) {
    if (!("speechSynthesis" in window)) {
      zeigeFehler("Vorlesen wird von diesem Browser nicht unterstützt.");
      return;
    }
    stoppeVorlesen();
    var lauf = vorleseLauf;
    var haeppchen = vorleseHaeppchen(text);
    var index = 0;
    // Stummer Nachlauf nach dem letzten Häppchen: CarPlay puffert Audio, iOS schließt die Tonausgabe
    // bei Sprechende sofort — ohne Nachlauf fehlten dort die letzten Wörter (Vermutung, 2026-09-25).
    function naechstesHaeppchen() {
      if (lauf !== vorleseLauf) { return; }
      if (index > haeppchen.length) { vorleseWarteschlange = []; return; }
      var nachlauf = index === haeppchen.length;
      var u = new SpeechSynthesisUtterance(nachlauf ? "Und weiter geht es mit der nächsten Runde." : haeppchen[index]);
      u.lang = "de-DE";
      if (nachlauf) { u.volume = 0; }
      index += 1;
      u.onend = naechstesHaeppchen;
      vorleseWarteschlange.push(u);
      window.speechSynthesis.speak(u);
    }
    naechstesHaeppchen();
  }

  function zeigeBlatt(name) {
    stoppeVorlesen();
    document.getElementById("start-blatt").style.display = name === "start" ? "block" : "none";
    document.getElementById("quiz-blatt").style.display = name === "quiz" ? "flex" : "none";
    document.getElementById("ende-blatt").style.display = name === "ende" ? "flex" : "none";
    document.getElementById("auswertung-blatt").style.display = name === "auswertung" ? "block" : "none";
    document.getElementById("kopf-zurueck-icon").style.display = name === "quiz" || name === "auswertung" ? "flex" : "none";
  }

  function quoteText(richtig, beantwortet) {
    return beantwortet > 0 ? Math.round((richtig / beantwortet) * 100) + "%" : "–";
  }

  function statKacheln(liste) {
    return liste.map(function (k) { return '<span class="stat"><b>' + esc(k[0]) + '</b><span>' + esc(k[1]) + '</span></span>'; }).join("");
  }

  function renderAuswertung() {
    var g = gesamtZaehler();
    document.getElementById("aw-antworten").innerHTML = statKacheln([
      [g.beantwortet, "Beantwortet"], [g.gewusst, "Richtig"], [g.beantwortet - g.gewusst, "Falsch"], [quoteText(g.gewusst, g.beantwortet), "Quote"]
    ]);

    var L = fortschritt.leiter;
    document.getElementById("aw-leiter").innerHTML = statKacheln([
      [euro(LEITER[L.stufe || 0]), "Aktuell"], [euro(LEITER[L.best || 0]), "Bestleistung"], [L.millionen || 0, "Millionen"]
    ]);

    var alle = alleFragenGemischt();
    var gesehen = 0;
    var gemeistert = 0;
    for (var i = 0; i < alle.length; i++) {
      if (fortschritt.fragenStatus[alle[i].id]) { gesehen += 1; }
      if (holeFragenStatus(alle[i].id).gewusstCount >= GEMEISTERT_AB) { gemeistert += 1; }
    }
    document.getElementById("aw-fragen").innerHTML = statKacheln([
      [gesehen, "Gesehen"], [gemeistert, "Gemeistert"], [nichtGewusstPool().length, "Nicht gewusst"], [alle.length - gesehen, "Noch offen"]
    ]);

    var zeilen = KATEGORIEN.map(function (kat) {
      var k = fortschritt.kategorien[kat.name] || {};
      var richtig = k.gewusst || 0;
      var beantwortet = richtig + (k.nichtGewusst || 0);
      return { kat: kat, richtig: richtig, beantwortet: beantwortet, quote: beantwortet > 0 ? richtig / beantwortet : 2 };
    });
    zeilen.sort(function (a, b) { return a.quote - b.quote || b.beantwortet - a.beantwortet; });
    document.getElementById("aw-kategorien").innerHTML = zeilen.map(function (z) {
      return '<tr><td>' + z.kat.icon + ' ' + esc(z.kat.name) + '</td><td>' + z.beantwortet + '</td>' +
        '<td class="richtig">' + z.richtig + '</td><td class="falsch">' + (z.beantwortet - z.richtig) + '</td>' +
        '<td>' + quoteText(z.richtig, z.beantwortet) + '</td></tr>';
    }).join("");

    document.getElementById("aw-abzeichen").innerHTML = ABZEICHEN.map(function (a) {
      var am = fortschritt.abzeichen[a.id];
      return '<span class="abzeichen ' + (am ? "erreicht" : "offen") + '"' + (am ? ' title="erreicht ' + esc(am) + '"' : "") +
        '><b aria-hidden="true">' + a.icon + '</b>' + esc(a.name) + (am ? "" : ' <span class="sr-only">(noch offen)</span>') + '</span>';
    }).join("");
  }

  // Nur zum Ausprobieren im Auto: klärt, ob Spracherkennung in der installierten iPhone-App läuft.
  function sprachtest(mitAnsage) {
    var ausgabe = document.getElementById("sprachtest-ausgabe");
    var Erkennung = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Erkennung) { ausgabe.textContent = "❌ Spracherkennung wird hier nicht unterstützt."; return; }
    function zuhoeren() {
      var r = new Erkennung();
      var gehoert = false;
      r.lang = "de-DE";
      r.interimResults = false;
      r.onresult = function (e) { gehoert = true; ausgabe.textContent = "✅ Verstanden: „" + e.results[0][0].transcript + "“"; };
      r.onerror = function (e) { gehoert = true; ausgabe.textContent = "❌ Fehler: " + e.error; };
      r.onend = function () { if (!gehoert) { ausgabe.textContent = "⏹ Nichts gehört."; } };
      ausgabe.textContent = "🎤 Ich höre zu …";
      try { r.start(); } catch (e) { ausgabe.textContent = "❌ Start fehlgeschlagen: " + e.message; }
    }
    if (!mitAnsage) { zuhoeren(); return; }
    stoppeVorlesen();
    sprachtestAnsage = new SpeechSynthesisUtterance("Sag jetzt gewusst oder nicht gewusst.");
    sprachtestAnsage.lang = "de-DE";
    sprachtestAnsage.onend = zuhoeren;
    ausgabe.textContent = "🔊 Ansage läuft …";
    window.speechSynthesis.speak(sprachtestAnsage);
  }

  function alleFragenGemischt() {
    var alle = [];
    var namen = Object.keys(fragenNachKategorie);
    for (var i = 0; i < namen.length; i++) {
      var liste = fragenNachKategorie[namen[i]];
      for (var j = 0; j < liste.length; j++) { alle.push(liste[j]); }
    }
    return alle;
  }

  function starteQuiz(kategorieId) {
    var id = kategorieId || aktiveKategorieId;
    var fragen;
    if (id === "alle") { fragen = gemischtPool(); }
    else if (id === "nichtGewusst") { fragen = nichtGewusstPool(); }
    else if (id === "faellig") { fragen = faelligPool(); }
    else { fragen = aktivePoolFuerKategorie(id); }
    if (!fragen || fragen.length === 0) {
      var geladen = id === "alle" ? alleFragenGemischt().length > 0 : (fragenNachKategorie[id] || []).length > 0;
      if (id === "nichtGewusst") {
        zeigeFehler("Noch keine als „Nicht gewusst“ markierten Fragen.");
      } else if (id === "faellig") {
        zeigeFehler("Heute ist nichts fällig 🎉", true);
      } else if (geladen) {
        zeigeFehler("Alle Fragen gemeistert 🎉", true);
      } else {
        zeigeFehler("Fragen sind noch nicht geladen.");
      }
      return;
    }
    aktiveKategorieId = id;
    quizFragen = mische(fragen);
    quizIndex = 0;
    quizGewusst = 0;
    zeigeBlatt("quiz");
    renderFrage();
  }

  function renderFrage() {
    antwortSichtbar = false;
    var frage = quizFragen[quizIndex];
    document.getElementById("frage-zaehler").textContent = "Frage " + (quizIndex + 1) + " von " + quizFragen.length;
    var stufe = fortschritt.leiter.stufe || 0;
    document.getElementById("leiter-anzeige").textContent = "💰 " + euro(LEITER[stufe]) + " · " + stufe + "/" + (LEITER.length - 1);
    document.getElementById("fortschritt-fuellung").style.width = Math.round((quizIndex / quizFragen.length) * 100) + "%";
    var fragenStatus = holeFragenStatus(frage.id);
    document.getElementById("frage-sterne").textContent = fragenStatus.gewusstCount > 0 ? "⭐".repeat(fragenStatus.gewusstCount) : "";
    document.getElementById("frage-daumen").textContent = fragenStatus.nichtGewusstCount > 0 ? "👎".repeat(fragenStatus.nichtGewusstCount) : "";
    document.getElementById("frage-text").innerHTML = esc(frage.frage);
    document.getElementById("antwort-kurz-text").innerHTML = esc(frage.antwortKurz);
    document.getElementById("erklaerung-text").innerHTML = esc(frage.erklaerung);
    document.getElementById("antwort-bereich").style.display = "none";
    document.getElementById("frage-knoepfe").style.display = "flex";
    document.getElementById("bewertung-knoepfe").style.display = "none";
    document.getElementById("vorlesen-btn").textContent = autoModus ? "🔁 Nochmal" : "🔊 Vorlesen";
    if (autoModus) { vorlesen(frage.frage); }
  }

  function antwortVorlesetext(frage) {
    return frage.antwortKurz + ". " + frage.erklaerung;
  }

  function zeigeAntwort() {
    antwortSichtbar = true;
    document.getElementById("antwort-bereich").style.display = "block";
    document.getElementById("frage-knoepfe").style.display = "none";
    document.getElementById("bewertung-knoepfe").style.display = "flex";
    if (autoModus) { vorlesen(antwortVorlesetext(quizFragen[quizIndex])); }
  }

  function bewerte(warGewusst) {
    var frage = quizFragen[quizIndex];
    var zaehler = kategorieZaehler(frage.kategorie);
    var status = holeFragenStatus(frage.id);
    var leiter = fortschritt.leiter;
    var meldungen = [];
    if (warGewusst) {
      zaehler.gewusst += 1;
      quizGewusst += 1;
      status.gewusstCount += 1;
      if (status.gewusstCount < GEMEISTERT_AB) { status.ort = "kategorie"; }
      status.faelligAb = tagPlus(WIEDERHOLUNG_TAGE[Math.min(status.gewusstCount, WIEDERHOLUNG_TAGE.length - 1)]);
      leiter.stufe = (leiter.stufe || 0) + 1;
      leiter.best = Math.max(leiter.best || 0, leiter.stufe);
      if (leiter.stufe === LEITER.length - 1) {
        leiter.millionen = (leiter.millionen || 0) + 1;
        leiter.stufe = 0;
        meldungen.push("🎉 Eine Million! Die Leiter beginnt von vorne.");
      }
    } else {
      zaehler.nichtGewusst += 1;
      status.nichtGewusstCount += 1;
      if (status.gewusstCount > 0) { status.gewusstCount -= 1; }
      if (status.gewusstCount === 0) { status.ort = "nichtGewusst"; }
      status.faelligAb = tagPlus(1);
      leiter.stufe = leiter.stufe >= 10 ? 10 : leiter.stufe >= 5 ? 5 : 0;
    }
    setzeFragenStatus(frage.id, status);

    var heute = fortschritt.heute;
    if (heute.tag !== tagPlus(0)) { heute.tag = tagPlus(0); heute.anzahl = 0; }
    heute.anzahl += 1;
    if (heute.anzahl === TAGESZIEL) {
      vermerkeStreakHeute();
      meldungen.push("🎯 Tagesziel erreicht! 🔥 " + fortschritt.streak.anzahl + " Tage");
    }
    pruefeAbzeichen().forEach(function (a) { meldungen.push("🏅 Neues Abzeichen: " + a); });
    speichereSicher(fortschritt);
    aktualisiereStartAnzeige();
    if (meldungen.length > 0) { zeigeFehler(meldungen.join(" · "), true); }
    stoppeVorlesen();

    quizIndex += 1;
    if (quizIndex >= quizFragen.length) {
      document.getElementById("fortschritt-fuellung").style.width = "100%";
      document.getElementById("ende-zahl").textContent = quizGewusst + " / " + quizFragen.length;
      zeigeBlatt("ende");
      aktualisiereStartAnzeige();
      aktualisiereKachelAnzahlen();
    } else {
      renderFrage();
    }
  }

  function ladeFragen() {
    for (var i = 0; i < KATEGORIEN.length; i++) {
      (function (kat) {
        fetch(kat.datei)
          .then(function (antwort) {
            if (!antwort.ok) { throw new Error("HTTP " + antwort.status); }
            return antwort.json();
          })
          .then(function (daten) {
            if (!Array.isArray(daten)) { throw new Error("Unerwartetes Format"); }
            fragenNachKategorie[kat.id] = daten;
            aktualisiereKachelAnzahlen();
            if (pruefeAbzeichen().length > 0) { speichereSicher(fortschritt); }
          })
          .catch(function () {
            zeigeFehler("Fragen für " + kat.name + " konnten nicht geladen werden.");
            setzeKategorieAnzahl(kat.id, "konnte nicht geladen werden");
          });
      })(KATEGORIEN[i]);
    }
  }

  document.getElementById("stat-knopf").addEventListener("click", function () { renderAuswertung(); zeigeBlatt("auswertung"); window.scrollTo(0, 0); });
  document.getElementById("kachel-alle").addEventListener("click", function () { starteQuiz("alle"); });
  document.getElementById("kachel-faellig").addEventListener("click", function () { starteQuiz("faellig"); });
  document.getElementById("sprachtest-ansage-btn").addEventListener("click", function () { sprachtest(true); });
  document.getElementById("sprachtest-direkt-btn").addEventListener("click", function () { sprachtest(false); });
  document.getElementById("kachel-nichtGewusst").addEventListener("click", function () { starteQuiz("nichtGewusst"); });
  document.getElementById("antwort-zeigen-btn").addEventListener("click", zeigeAntwort);
  document.getElementById("nicht-gewusst-btn").addEventListener("click", function () { bewerte(false); });
  document.getElementById("gewusst-btn").addEventListener("click", function () { bewerte(true); });
  document.getElementById("kopf-zurueck-icon").addEventListener("click", function () { zeigeBlatt("start"); aktualisiereStartAnzeige(); aktualisiereKachelAnzahlen(); });
  document.getElementById("ende-zurueck-btn").addEventListener("click", function () { zeigeBlatt("start"); aktualisiereStartAnzeige(); aktualisiereKachelAnzahlen(); });
  document.getElementById("ende-nochmal-btn").addEventListener("click", function () { starteQuiz(); });
  document.getElementById("vorlesen-btn").addEventListener("click", function () {
    var frage = quizFragen[quizIndex];
    if (!frage) { return; }
    var text = antwortSichtbar ? antwortVorlesetext(frage) : frage.frage;
    vorlesen(text);
  });

  var autoSchalter = document.getElementById("auto-modus");
  autoSchalter.checked = false;
  autoSchalter.addEventListener("change", function () { autoModus = autoSchalter.checked; });

  renderKategorienListe();
  aktualisiereStartAnzeige();
  ladeFragen();
  zeigeBlatt("start");
})();
</script>
</body>
</html>
